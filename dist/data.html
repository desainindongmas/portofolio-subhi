const collection=['profile','experience','education','skills','projects'];const singular={experience:'Pengalaman',education:'Pendidikan',skills:'Keahlian',projects:'Brand / Proyek'};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);function target(type,id){return type==='profile'?data.profile:data[type].find(x=>x.id===id)}function ownerKey(type,id){return type==='profile'?'profile':type+':'+id}function status(msg,error=false){$('#save').textContent=msg;$('#save').classList.toggle('error',error)}function toast(msg,fn){const t=$('#toast');t.textContent=msg;if(fn){const b=document.createElement('button');b.textContent='Urungkan';b.onclick=()=>{fn();t.hidden=true};t.append(b)}t.hidden=false;clearTimeout(undo);undo=setTimeout(()=>t.hidden=true,8000)}
async function persist(){if(!db){status('Penyimpanan browser tidak tersedia. Unduh JSON sebelum keluar.',true);return}if(saving){pending=true;return}saving=true;status('Menyimpan…');try{await new Promise((resolve,reject)=>{const tx=db.transaction('draft','readwrite');tx.objectStore('draft').put(data,'current');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});status('Tersimpan di browser ini · '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}));}catch(e){status('Gagal menyimpan. Unduh JSON sebagai cadangan.',true)}finally{saving=false;if(pending){pending=false;persist()}}}function changed(){clearTimeout(timer);status('Perubahan belum disimpan…');timer=setTimeout(persist,400);progress()}
function field(type,id,s){const [key,label,kind,placeholder,important]=s,obj=target(type,id),value=obj[key]??'',attr=`data-type="${type}" data-id="${esc(id)}" data-key="${key}"`,fid=type+'-'+id+'-'+key;let control='';if(kind==='check')return `<div class="field wide"><label class="pill"><input type="checkbox" ${attr} ${value?'checked':''}>${label}</label></div>`;if(kind==='types'){control='<div class="pillbox">'+['Website','Web App','Konten Medsos','Identitas Visual','Lainnya'].map(t=>`<label class="pill"><input type="checkbox" ${attr} data-value="${t}" ${(Array.isArray(value)?value:[]).includes(t)?'checked':''}>${t}</label>`).join('')+'</div>'}else if(kind==='area')control=`<textarea id="${fid}" ${attr} placeholder="${esc(placeholder)}">${esc(value)}</textarea>`;else if(kind==='select')control=`<select id="${fid}" ${attr}><option value="">Pilih…</option>${placeholder.split('|').map(t=>`<option ${value===t?'selected':''}>${esc(t)}</option>`).join('')}</select>`;else control=`<input id="${fid}" type="${kind}" ${attr} value="${esc(value)}" placeholder="${esc(placeholder)}" ${key==='to'&&obj.current?'disabled':''}>`;return `<div class="field ${kind==='area'||kind==='types'?'wide':''}"><label ${kind!=='types'?`for="${fid}"`:''}>${label}${important?' <small>· utama</small>':''}</label>${control}</div>`}
function assets(type,id){const owner=ownerKey(type,id),items=data.assets.filter(x=>x.owner===owner);return `<div class="subhead">${type==='profile'?'Foto profil & CV PDF':'Logo & contoh karya'}</div><p class="help">${type==='profile'?'Foto PNG/JPG/WebP; CV dalam PDF.':'Lampirkan logo, screenshot, feed, carousel, atau story. Nama file sebaiknya menjelaskan isi dan urutannya.'} Maks. 8 MB per file, total 50 MB. Aset ikut dalam unduhan JSON.</p><div class="upload"><input type="file" data-upload="${owner}" accept="image/png,image/jpeg,image/webp,application/pdf" multiple aria-label="Lampirkan ${type==='profile'?'foto profil atau CV':'logo atau karya'}"><div class="attachments">${items.map(a=>`<div class="asset">${a.mime.startsWith('image/')?`<img src="${a.content}" alt="${esc(a.name)}">`:'<p>PDF</p>'}<div title="${esc(a.name)}">${esc(a.name)}</div><button data-remove-asset="${a.id}">Lepas lampiran</button></div>`).join('')}</div></div>`}
function progress(){const ready=[!!(data.profile.name?.trim()&&data.profile.bio?.trim()),data.experience.some(x=>x.company?.trim()&&x.role?.trim()&&x.scope?.trim()),data.education.some(x=>x.institution?.trim()&&x.program?.trim()),data.skills.some(x=>x.name?.trim()&&x.application?.trim()),data.projects.some(x=>x.brand?.trim()&&x.role?.trim())];const n=ready.filter(Boolean).length;$('#progress').style.width=n/5*100+'%';$('#progresslabel').textContent=n+' dari 5 bagian memiliki data utama · tidak wajib lengkap';$('#steps').innerHTML=names.map((n,i)=>`<button class="${i===step?'active':''}" data-step="${i}" ${i===step?'aria-current="step"':''}><span>${ready[i]?'✓':String(i+1).padStart(2,'0')}</span>${n}</button>`).join('')}
function render(){progress();$('#heading').textContent=names[step];$('#lead').textContent=leads[step];$('#stepcount').textContent=String(step+1).padStart(2,'0')+' / 06';$('#prev').hidden=step===0;$('#next').hidden=step===5;const type=collection[step];if(step===0){$('#content').innerHTML='<div class="info">Isi hanya informasi yang ingin kamu tampilkan secara profesional. Draft disimpan pada browser/perangkat ini, belum tersinkron antarperangkat. Unduh JSON untuk cadangan.</div><div class="fields">'+schemas.profile.map(s=>field('profile','',s)).join('')+'</div>'+assets('profile','');}else if(step<5){$('#content').innerHTML=(data[type].length?data[type].map((obj,i)=>`<article class="record"><div class="recordhead"><h3>${singular[type]} ${i+1}</h3><button class="remove" data-remove="${obj.id}" data-type="${type}">Hapus entri</button></div><div class="fields">${schemas[type].map(s=>field(type,obj.id,s)).join('')}</div>${type==='projects'?assets(type,obj.id):''}</article>`).join(''):'<div class="empty">Belum ada entri. Tekan tombol di bawah untuk mulai.</div>')+`<button class="add" data-add="${type}">+ Tambah ${singular[type].toLowerCase()}</button>`;}else review();}
function review(){let html='<div class="info">Unduh <b>JSON + lampiran</b> untuk melanjutkan di browser lain atau mengirim seluruh data ke chat ini. Unduhan ringkasan hanya berisi teks, tanpa file lampiran. Mengisi formulir tidak otomatis mengubah portofolio.</div>';collection.forEach((type,i)=>{const items=type==='profile'?[data.profile]:data[type];html+=`<article class="summary"><div class="summaryhead"><h3>${names[i]} ${i?'('+items.length+')':''}</h3><button data-step="${i}">Edit →</button></div>`;if(!items.length)html+='<p>Belum diisi.</p>';items.forEach(obj=>{const lines=schemas[type].filter(s=>obj[s[0]]!==undefined&&obj[s[0]]!==''&&obj[s[0]]!==false).map(s=>`${s[1]}: ${Array.isArray(obj[s[0]])?obj[s[0]].join(', '):obj[s[0]]===true?'Ya':obj[s[0]]}`);html+='<p>'+esc(lines.join('\n'))+'</p>'});html+='</article>'});html+=`<p class="lead">${data.assets.length} lampiran · ${(data.assets.reduce((n,a)=>n+a.size,0)/1024/1024).toFixed(1)} MB. Lampiran disertakan dalam JSON.</p><div class="downloads"><button class="btn" data-export="json">Unduh JSON + lampiran ↓</button><button class="btn secondary" data-export="md">Unduh ringkasan teks ↓</button></div><p class="help">Setelah diunduh, lampirkan file JSON ke percakapan ini agar aku bisa mengolah data dan asetnya. Untuk melanjutkan pengisian sendiri, impor JSON melalui panel di bawah.</p><details><summary>Lanjutkan dari file JSON</summary><p class="help">Data dari file menggantikan draft browser ini. Salinan draft saat ini akan diunduh terlebih dahulu.</p><label class="import">Pilih file data sebelumnya<input id="import" type="file" accept=".json,application/json"></label></details>`;$('#content').innerHTML=html;}
function download(kind){const stamp=new Date().toISOString().slice(0,10);let text;if(kind==='json')text=JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2);else{text='# Data Portofolio — '+(data.profile.name||'Muhammad Subhi')+'\n\n';collection.forEach((type,i)=>{text+='## '+names[i]+'\n\n';(type==='profile'?[data.profile]:data[type]).forEach((obj,j)=>{if(type!=='profile')text+='### Entri '+(j+1)+'\n\n';schemas[type].forEach(([k,l])=>{if(obj[k]!==undefined&&obj[k]!==''&&obj[k]!==false)text+='**'+l+':** '+(Array.isArray(obj[k])?obj[k].join(', '):obj[k]===true?'Ya':obj[k])+'\n\n'})});});text+='## Lampiran (file hanya ada dalam JSON)\n\n'+data.assets.map(a=>'- '+a.name+' — '+a.owner).join('\n');}const blob=new Blob([text],{type:kind==='json'?'application/json':'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Muhammad_Subhi_Portfolio_'+stamp+'.'+kind;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
$('#steps').onclick=e=>{const b=e.target.closest('[data-step]');if(b){step=+b.dataset.step;render()}};$('#prev').onclick=()=>{step--;render();window.scrollTo(0,0)};$('#next').onclick=()=>{step++;render();window.scrollTo(0,0)};
$('#content').addEventListener('input',e=>{const el=e.target;if(!el.dataset.key)return;const obj=target(el.dataset.type,el.dataset.id);if(!obj)return;if(el.dataset.value){const list=Array.isArray(obj[el.dataset.key])?obj[el.dataset.key]:[];obj[el.dataset.key]=el.checked?[...new Set([...list,el.dataset.value])]:list.filter(v=>v!==el.dataset.value)}else obj[el.dataset.key]=el.type==='checkbox'?el.checked:el.value;if(el.dataset.key==='current'){const end=document.querySelector(`input[data-id="${el.dataset.id}"][data-key="to"]`);if(end)end.disabled=el.checked;}changed()});
$('#content').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.add){data[b.dataset.add].push({id:uid()});render();changed();const els=document.querySelectorAll('.record');els[els.length-1]?.scrollIntoView({behavior:'smooth',block:'start'})}if(b.dataset.remove){const type=b.dataset.type,idx=data[type].findIndex(x=>x.id===b.dataset.remove),obj=data[type].splice(idx,1)[0],related=data.assets.filter(a=>a.owner===ownerKey(type,obj.id));data.assets=data.assets.filter(a=>a.owner!==ownerKey(type,obj.id));render();changed();toast('Entri dihapus.',()=>{data[type].splice(idx,0,obj);data.assets.push(...related);render();changed()})}if(b.dataset.removeAsset){const idx=data.assets.findIndex(a=>a.id===b.dataset.removeAsset),obj=data.assets.splice(idx,1)[0];render();changed();toast('Lampiran dilepas.',()=>{data.assets.splice(idx,0,obj);render();changed()})}if(b.dataset.step!==undefined){step=+b.dataset.step;render();window.scrollTo(0,0)}if(b.dataset.export){download(b.dataset.export);toast('File unduhan disiapkan. Simpan sebagai cadangan.')}};
function clean(raw){if(!raw||raw.schema!=='subhi-portfolio-v1'||!raw.profile||!Array.isArray(raw.projects))throw Error('Format JSON tidak dikenali. Gunakan ekspor dari formulir ini.');const out=blank();collection.forEach(type=>{const records=type==='profile'?[raw.profile]:raw[type];if(!Array.isArray(records)||records.length>300)throw Error('Daftar data tidak valid.');const mapped=records.map(r=>{if(!r||typeof r!=='object')throw Error('Entri tidak valid.');const obj=type==='profile'?{}:{id:typeof r.id==='string'&&/^[a-zA-Z0-9_-]{1,80}$/.test(r.id)?r.id:uid()};schemas[type].forEach(([k,l,kind])=>{if(kind==='types')obj[k]=Array.isArray(r[k])?r[k].filter(x=>['Website','Web App','Konten Medsos','Identitas Visual','Lainnya'].includes(x)):[];else if(kind==='check')obj[k]=r[k]===true;else if(typeof r[k]==='string')obj[k]=r[k].slice(0,30000)});return obj});if(type==='profile')out.profile=mapped[0]||{};else out[type]=mapped});let bytes=0;out.assets=(Array.isArray(raw.assets)?raw.assets:[]).map(a=>{if(!a||!['image/png','image/jpeg','image/webp','application/pdf'].includes(a.mime)||typeof a.content!=='string'||(!a.content.startsWith('data:'+a.mime+';base64,')||!/^[A-Za-z0-9+/]*={0,2}$/.test(a.content.split(',')[1]||''))||a.content.length>11500000)throw Error('Lampiran JSON tidak valid.');bytes+=a.content.length;if(bytes>71000000)throw Error('Lampiran terlalu besar.');return{id:uid(),owner:String(a.owner||'').slice(0,100),name:String(a.name||'file').slice(0,255),size:Math.ceil(a.content.length*.75),mime:a.mime,content:a.content}});return out}
$('#content').addEventListener('change',async e=>{const el=e.target;if(el.dataset.upload){const owner=el.dataset.upload,files=[...el.files];let total=data.assets.reduce((n,a)=>n+a.size,0),added=0;for(const f of files){if(!['image/png','image/jpeg','image/webp','application/pdf'].includes(f.type)||f.size>8*1024*1024){toast(f.name+': gunakan PNG/JPG/WebP/PDF maksimal 8 MB.');continue}if(total+f.size>50*1024*1024){toast('Total lampiran melewati 50 MB. Gunakan link folder untuk aset tambahan.');break}try{const content=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(f)});data.assets.push({id:uid(),owner,name:f.name,size:f.size,mime:f.type,content});total+=f.size;added++}catch{toast('Gagal membaca '+f.name)}}render();changed();if(added)toast(added+' lampiran ditambahkan.')}if(el.id==='import'&&el.files[0]){try{if(el.files[0].size>75*1024*1024)throw Error('File terlalu besar.');const parsed=clean(JSON.parse(await el.files[0].text()));download('json');data=parsed;step=5;render();changed();toast('Data berhasil diimpor. Draft sebelumnya diunduh sebagai cadangan.')}catch(err){toast(err.message||'File tidak dapat dibaca.')}}});
(async()=>{try{db=await new Promise((resolve,reject)=>{const req=indexedDB.open(key,1);req.onupgradeneeded=()=>req.result.createObjectStore('draft');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});const saved=await new Promise((resolve,reject)=>{const tx=db.transaction('draft','readonly'),req=tx.objectStore('draft').get('current');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});if(saved)data=clean(saved);status(saved?'Draft sebelumnya dipulihkan · browser ini':'Siap · draft tersimpan otomatis di browser ini');}catch{status('Penyimpanan browser tidak tersedia. Unduh JSON sebelum keluar.',true)}render()})();
