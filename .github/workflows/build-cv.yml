name: Rebuild bilingual CV PDFs
on:
  push:
    branches:
      - main
      - content/career-skills-refresh-2026-11-12
    paths:
      - "dist/portfolio-data.js"
      - "scripts/build-cv.py"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build PDF
        run: |
          python -m pip install --disable-pip-version-check reportlab
          python scripts/build-cv.py
          python - <<'PY'
          from pathlib import Path
          for lang in ('id','en'):
              p=Path('dist/downloads/muhammad-subhi-cv-'+lang+'.pdf')
              assert p.is_file() and p.stat().st_size > 1000, p
              assert p.read_bytes()[:5] == b'%PDF-', p
              print(p, p.stat().st_size)
          PY
      - name: Commit regenerated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/downloads/muhammad-subhi-cv-id.pdf dist/downloads/muhammad-subhi-cv-en.pdf
          if git diff --cached --quiet; then
            echo "CV PDFs already current"
          else
            git commit -m "chore(cv): regenerate bilingual PDF downloads [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
